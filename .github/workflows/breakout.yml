name: generate breakout svg

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch: {}

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: jcklyndr
          ball_color: "#00ff66"
          paddle_color: "#00ff66"
          bricks_colors: "#00ff66,#1e7a3c,#155c2b,#0d3d1c,#0a2914"

      - name: Move generated SVGs
        run: |
          mkdir -p /tmp/breakout-images
          mv output/light.svg /tmp/breakout-images/breakout-light.svg
          mv output/dark.svg /tmp/breakout-images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit SVGs
        run: |
          mkdir -p output
          mv /tmp/breakout-images/breakout-light.svg output/breakout-light.svg
          mv /tmp/breakout-images/breakout-dark.svg output/breakout-dark.svg
          git add output/
          git commit -m "Update breakout SVG" || echo "No changes"
          git push
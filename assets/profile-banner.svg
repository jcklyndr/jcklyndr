    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004032"/>
      <stop offset="50%" stop-color="#59ECCC"/>
      <stop offset="100%" stop-color="#004032"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Ma. Jackielyn S. Duero</title>
  <desc id="desc">AIT Graduate. Frontend Developer, QA, and Web Designer. I build. I document. I test.</desc>
  <style>
    .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit-outer { animation: orbit 7s linear infinite; transform-origin: 1045px 162px; }
    .orbit-inner { animation: orbit 7s linear infinite; animation-delay: -3.5s; transform-origin: 1045px 162px; }
    .counter-outer { animation: counter-spin 7s linear infinite; transform-origin: 1045px 14px; }
    .counter-inner { animation: counter-spin 7s linear infinite; animation-delay: -3.5s; transform-origin: 1045px 57px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes counter-spin { to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin, .orbit-outer, .orbit-inner, .counter-outer, .counter-inner { animation: none; } }
  </style>
  <defs>
